<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Aetheria">
  <!-- An A whose apex does not close. The subject of the mark is the opening
       between the strokes — "Alandaki Açık", the gap the app exists to find.

       Flat ground, no gradient, no stock glyph. The mark reads at 16px because
       it is three strokes and the gap is a fifth of the width. -->
  <rect width="32" height="32" fill="#2563eb"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round">
    <path d="M8 25 L14.2 10"/>
    <path d="M24 25 L17.8 10"/>
    <path d="M11.9 19.4 L20.1 19.4"/>
  </g>
</svg>
